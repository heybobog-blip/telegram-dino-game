<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mario Run</title>
    <style>
        body { margin: 0; padding: 0; background: #5c94fc; font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* พื้นหลัง: ท้องฟ้า + พื้นดินแบบไล่สี */
        #gameContainer { 
            position: relative; 
            width: 320px; 
            height: 180px; 
            background: linear-gradient(#5c94fc 80%, #c84c0c 80%); /* สีฟ้าตัดสีน้ำตาลอิฐ */
            border: 4px solid #000; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
        }
        
        #gameCanvas { display: block; }
        
        #scoreBoard { position: absolute; top: 10px; left: 10px; font-size: 18px; color: #fff; text-shadow: 2px 2px #000; font-weight: bold; z-index: 10;}
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; text-align: center; text-shadow: 2px 2px #000; width: 100%; z-index: 10; font-weight: bold; }
    </style>
    <script src="https://telegram.org/js/games.js"></script>
</head>
<body>
    <div id="gameContainer">
        <div id="scoreBoard">Score: 0</div>
        <canvas id="gameCanvas" width="320" height="180"></canvas>
        <div id="msg">Tap to Start!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- ตั้งค่าเกม ---
        let gameSpeed = 3;
        let gravity = 0.6;
        let jumpPower = -9;
        let score = 0;
        let gameRunning = false;
        
        // ตัวละคร (ขนาด 24x30)
        let player = { x: 40, y: 114, w: 24, h: 30, dy: 0, grounded: true };
        let obstacles = [];
        const groundY = 114; // จุดยืนบนพื้น

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id'); 
        const chatId = urlParams.get('chat_id');
        const messageId = urlParams.get('message_id');

        // --- ฟังก์ชันวาดมาริโอ้ (วาดเองไม่ง้อรูป) ---
        function drawMario(x, y) {
            // หัว (สีเนื้อ)
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(x + 4, y, 16, 10);
            
            // หมวก (สีแดง)
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x + 4, y, 16, 4); // ตัวหมวก
            ctx.fillRect(x + 14, y + 2, 8, 2); // ปีกหมวก
            
            // เสื้อ (สีแดง)
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x + 4, y + 10, 16, 10);
            
            // เอี๊ยม (สีน้ำเงิน)
            ctx.fillStyle = '#0000ff';
            ctx.fillRect(x + 6, y + 16, 12, 8); // ตัวเอี๊ยม
            ctx.fillRect(x + 2, y + 12, 4, 8);  // แขนซ้าย
            ctx.fillRect(x + 18, y + 12, 4, 8); // แขนขวา
            
            // รองเท้า (สีน้ำตาล)
            ctx.fillStyle = '#663300';
            ctx.fillRect(x + 2, y + 24, 8, 6);
            ctx.fillRect(x + 14, y + 24, 8, 6);
        }

        // --- ฟังก์ชันวาดท่อ (วาดเองไม่ง้อรูป) ---
        function drawPipe(x, y, w, h) {
            // ขอบดำ
            ctx.fillStyle = '#000';
            ctx.fillRect(x, y, w, h);
            
            // ตัวท่อสีเขียว
            ctx.fillStyle = '#00aa00'; 
            ctx.fillRect(x + 2, y + 2, w - 4, h - 2);
            
            // เงาสีเขียวอ่อน (Highlight)
            ctx.fillStyle = '#55ff55';
            ctx.fillRect(x + 4, y + 2, 4, h - 2);
            
            // หัวท่อ (Rim)
            ctx.fillStyle = '#000';
            ctx.fillRect(x - 2, y, w + 4, 10); // ขอบหัวท่อ
            ctx.fillStyle = '#00aa00';
            ctx.fillRect(x, y + 2, w, 6); // สีหัวท่อ
        }

        function createObstacle() {
            let gap = Math.random() * 150 + 200; 
            // สร้างท่อ สูง 40
            obstacles.push({ x: canvas.width + gap, y: 104, w: 26, h: 40 }); 
        }

        function update() {
            if (!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // --- วาดพื้นดิน (ลายอิฐ) ---
            ctx.fillStyle = '#c84c0c'; // สีดิน
            ctx.fillRect(0, 144, canvas.width, 36);
            ctx.fillStyle = '#f89c6c'; // เส้นลายอิฐ
            ctx.fillRect(0, 146, canvas.width, 2);
            // -------------------------

            // Player Physics
            player.dy += gravity;
            player.y += player.dy;
            if (player.y > groundY) { player.y = groundY; player.dy = 0; player.grounded = true; }
            
            // วาดมาริโอ้
            drawMario(player.x, player.y);

            // Obstacles
            if (Math.random() < 0.015) { 
                 if (obstacles.length === 0 || canvas.width - obstacles[obstacles.length-1].x > 180) {
                    createObstacle();
                 }
            }
            
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                
                // วาดท่อ
                drawPipe(obs.x, obs.y, obs.w, obs.h);

                // Collision Detection (เช็คชนแบบละเอียดขึ้น)
                if (player.x < obs.x + obs.w - 4 && player.x + player.w > obs.x + 4 &&
                    player.y < obs.y + obs.h && player.y + player.h > obs.y) {
                    gameOver();
                }
            }
            obstacles = obstacles.filter(obs => obs.x > -40);

            // Score
            score++;
            if (score % 500 === 0) gameSpeed += 0.2; 
            document.getElementById('scoreBoard').innerText = "Score: " + Math.floor(score/10);
            
            requestAnimationFrame(update);
        }

        function jump() {
            if (!gameRunning) {
                startGame();
            } else if (player.grounded) {
                player.dy = jumpPower;
                player.grounded = false;
            }
        }

        function startGame() {
            score = 0;
            gameSpeed = 3;
            obstacles = [];
            gameRunning = true;
            player.y = groundY;
            document.getElementById('msg').innerText = "";
            update();
        }

        function gameOver() {
            gameRunning = false;
            let finalScore = Math.floor(score/10);
            document.getElementById('msg').innerHTML = "GAME OVER!<br>Score: " + finalScore + "<br>Sending score...";
            sendScoreToBot(finalScore);
        }

        function sendScoreToBot(score) {
            // ✅ ลิ้งก์ Render ของคุณ (ใส่ให้แล้ว)
            const serverUrl = "https://dino-bot-server.onrender.com/submit_score";

            fetch(`${serverUrl}?id=${userId}&score=${score}&chat_id=${chatId}&message_id=${messageId}`)
            .then(response => {
                if (response.ok) {
                    document.getElementById('msg').innerHTML = "GAME OVER!<br>Score Saved!<br>Tap to play again";
                } else {
                    document.getElementById('msg').innerText = "Error saving score.";
                }
            })
            .catch(error => {
                document.getElementById('msg').innerText = "Connection Error.";
            });
        }

        document.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });
        document.addEventListener('touchstart', jump);
        document.addEventListener('click', jump);
    </script>
</body>
</html>
