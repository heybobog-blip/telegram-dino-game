<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jetpack Mario (Smooth)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEFA 0%, #E0F7FA 100%);
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #scoreBoard {
            position: absolute;
            top: 40px; right: 20px;
            font-family: 'Verdana', sans-serif;
            font-size: 24px; font-weight: bold;
            color: #333; /* เปลี่ยนสีตัวเลขให้ชัดกับท้องฟ้า */
            text-shadow: 2px 2px 0px white;
            z-index: 10;
        }

        #msg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Verdana', sans-serif;
            font-size: 20px; color: #333;
            background: rgba(255,255,255,0.95);
            padding: 25px; border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 20; display: none;
            width: 80%; max-width: 300px;
        }
        
        .btn {
            background: #ff4757; color: white; border: none;
            padding: 12px 24px; font-size: 18px;
            border-radius: 50px; margin-top: 15px;
            cursor: pointer; box-shadow: 0 4px #c0392b;
            font-weight: bold;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #c0392b; }

        #tutorial {
            position: absolute; bottom: 20%; width: 100%;
            text-align: center; color: #333;
            font-family: sans-serif; font-size: 16px;
            text-shadow: 1px 1px 0px white;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
    <script src="https://telegram.org/js/games.js"></script>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreBoard">Score: 0</div>
        <div id="tutorial">Tap & Hold to Fly!</div>
        <div id="msg">
            <h2 id="msgTitle">Ready?</h2>
            <p id="msgText">Avoid obstacles!</p>
            <button class="btn" onclick="startGame()">START</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ตั้งค่าเกม (ปรับให้นุ่มนวล) ---
        let gameSpeed = 3;      
        // ปรับแรงโน้มถ่วงลดลง (ตกช้าลง)
        let gravity = 0.15;     
        // ปรับแรงขับลดลง (ขึ้นช้าลง) ควบคุมง่ายขึ้น
        let thrust = -0.35;     
        let maxFallSpeed = 5;
        let score = 0;
        let gameRunning = false;
        let isHolding = false;  
        
        // --- กราฟิก SVG ---
        const marioSVG = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMCAzMCI+CiAgPHBhdGggZmlsbD0icmVkIiBkPSJNOCA1aDE0djRoLTR2NGg0djRoLTR2NGg0djRINHdiLTR2LTRoNHYtNGgtNHYtNGg0di00eiIvPgogIDxwYXRoIGZpbGw9IiNmZmNjOTkiIGQ9Ik04IDloMTJ2NGgtNHY0aC00di00aC00eiIvPgogIDxwYXRoIGZpbGw9ImJsdWUiIGQ9Ik04IDE3aDE0djRoLTR2NGg0djVINHdiLTVoNHYtNGgtNHYtNHoiLz4KICA8cGF0aCBmaWxsPSJvcmFuZ2UiIGQ9Ik0yIDIySDB2NGgyeiIvPjwvc3ZnPg==`;
        const pipeSVG = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMCA1MCI+CiAgPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjMwIiBoZWlnaHQ9IjUwIiBmaWxsPSIjNDNjZTA1IiBzdHJva2U9ImJsYWNrIiBzdHJva2Utd2lkdGg9IjIiLz4KICA8cmVjdCB4PSIyIiB5PSIyIiB3aWR0aD0iMjYiIGhlaWdodD0iNDYiIGZpbGw9IiM2NmZmNjYiIG9wYWNpdHk9IjAuMyIvPjwvc3ZnPg==`;
        const cloudSVG = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MCAzMCI+CiAgPHBhdGggZmlsbD0id2hpdGUiIGQ9Ik0xMCAyMCBBMTAgMTAgMCAwIDEgMzAgMjAgQTEwIDEwIDAgMCAxIDQwIDIwIEExMCAxMCAwIDAgMSA1MCAzMCBMMCAzMCBBMTAgMTAgMCAwIDEgMTAgMjB6IiBzdHJva2U9IiNjY2MiIHN0cm9rZS13aWR0aD0iMiIvPjwvc3ZnPg==`;
        const missileSVG = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCAyMCI+CiAgPHJlY3QgeD0iMCIgeT0iNSIgd2lkdGg9IjMwIiBoZWlnaHQ9IjEwIiBmaWxsPSJvcmFuZ2UiIHN0cm9rZT0iYmxhY2siLz4KICA8cGF0aCBmaWxsPSJyZWQiIGQ9Ik0zMCA1IEw0MCAxMCBXMzAgMTUgeiIvPgogIDxyZWN0IHg9IjUiIHk9IjUiIHdpZHRoPSIxMCIgaGVpZ2h0PSIxMCIgZmlsbD0id2hpdGUiIG9wYWNpdHk9IjAuNSIvPjwvc3ZnPg==`;

        const marioImg = new Image(); marioImg.src = marioSVG;
        const pipeImg = new Image(); pipeImg.src = pipeSVG;
        const cloudImg = new Image(); cloudImg.src = cloudSVG;
        const missileImg = new Image(); missileImg.src = missileSVG;

        let player = { x: 50, y: 200, w: 40, h: 40, dy: 0 };
        let obstacles = [];
        let particles = []; 

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id'); 
        const chatId = urlParams.get('chat_id');
        const messageId = urlParams.get('message_id');
        const serverUrl = "https://dino-bot-server.onrender.com/submit_score";

        fetch(serverUrl).catch(e => {});

        function showMsg(title, text, showButton=true) {
            const m = document.getElementById('msg');
            m.style.display = 'block';
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerHTML = text;
            m.querySelector('.btn').style.display = showButton ? 'inline-block' : 'none';
        }

        function createObstacle() {
            let rand = Math.random();
            let startX = canvas.width + 100;
            
            if (rand < 0.5) {
                // ท่อล่าง (50%)
                let h = Math.random() * (canvas.height/3) + 50; 
                obstacles.push({ x: startX, y: canvas.height - h, w: 50, h: h, type: 'pipe' });
            } else if (rand < 0.8) {
                // เมฆกลาง (30%)
                let y = Math.random() * (canvas.height - 200) + 50;
                obstacles.push({ x: startX, y: y, w: 60, h: 40, type: 'cloud' });
            } else {
                // จรวดบน (20%)
                let y = Math.random() * 50; 
                obstacles.push({ x: startX, y: y, w: 50, h: 25, type: 'missile' });
            }
        }

        function createParticle() {
            particles.push({ x: player.x, y: player.y + 30, size: Math.random()*5+2, life: 10 });
        }

        function update() {
            if (!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // --- ฟิสิกส์การบิน (นุ่มนวล) ---
            if (isHolding) {
                player.dy += thrust; 
                createParticle();    
            } else {
                player.dy += gravity; 
            }
            if (player.dy > maxFallSpeed) player.dy = maxFallSpeed;
            if (player.dy < -maxFallSpeed) player.dy = -maxFallSpeed; // จำกัดความเร็วขึ้นด้วย
            
            player.y += player.dy;

            // ชนเพดาน -> ไม่ตาย แต่ไม่ให้ทะลุ
            if (player.y < 0) { 
                player.y = 0; 
                player.dy = 0; 
            }
            // ชนพื้น -> ตาย
            if (player.y + player.h > canvas.height) {
                gameOver();
                return;
            }

            // วาดเอฟเฟกต์
            for(let i=0; i<particles.length; i++){
                let p = particles[i];
                ctx.fillStyle = `rgba(255, 100, 0, ${p.life/10})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                p.x -= gameSpeed; p.life--;
            }
            particles = particles.filter(p => p.life > 0);

            // วาดตัวละคร
            ctx.save();
            ctx.translate(player.x + player.w/2, player.y + player.h/2);
            // เอียงน้อยลง
            ctx.rotate(player.dy * 0.03); 
            ctx.drawImage(marioImg, -player.w/2, -player.h/2, player.w, player.h);
            ctx.restore();

            if (obstacles.length === 0 || canvas.width - obstacles[obstacles.length-1].x > 250) { 
                createObstacle();
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                
                if (obs.type === 'pipe') ctx.drawImage(pipeImg, obs.x, obs.y, obs.w, obs.h);
                else if (obs.type === 'cloud') ctx.drawImage(cloudImg, obs.x, obs.y, obs.w, obs.h);
                else if (obs.type === 'missile') ctx.drawImage(missileImg, obs.x, obs.y, obs.w, obs.h);

                if (player.x < obs.x + obs.w - 10 && 
                    player.x + player.w > obs.x + 10 &&
                    player.y < obs.y + obs.h - 5 && 
                    player.y + player.h > obs.y + 5) {
                    gameOver();
                }
            }
            obstacles = obstacles.filter(obs => obs.x > -100);

            score++;
            document.getElementById('scoreBoard').innerText = "Score: " + Math.floor(score/10);
            
            if (score % 500 === 0) gameSpeed += 0.2;

            requestAnimationFrame(update);
        }

        function startGame() {
            document.getElementById('msg').style.display = 'none';
            document.getElementById('tutorial').style.display = 'none';
            score = 0;
            gameSpeed = 3;  
            obstacles = [];
            particles = [];
            player.y = canvas.height / 2;
            player.dy = 0;
            gameRunning = true;
            createObstacle();
            update();
        }

        function gameOver() {
            gameRunning = false;
            let finalScore = Math.floor(score/10);
            
            showMsg("GAME OVER", `Score: ${finalScore}<br>Saving...`, false);
            
            fetch(`${serverUrl}?id=${userId}&score=${finalScore}&chat_id=${chatId}&message_id=${messageId}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showMsg("GAME OVER", `Score: ${finalScore}<br>✅ Saved!`, true);
                    document.querySelector('.btn').innerText = "PLAY AGAIN";
                } else {
                    showMsg("GAME OVER", `Score: ${finalScore}<br>⚠️ Save Error`, true);
                }
            })
            .catch(() => {
                showMsg("GAME OVER", `Score: ${finalScore}<br>✅ Saved (Offline)`, true); 
            });
        }

        function startHold(e) { 
            if (e.type === 'touchstart') e.preventDefault(); 
            if (!gameRunning) return;
            isHolding = true; 
        }
        function endHold(e) { isHolding = false; }

        document.addEventListener('mousedown', startHold);
        document.addEventListener('mouseup', endHold);
        document.addEventListener('touchstart', startHold, {passive: false});
        document.addEventListener('touchend', endHold);
        
        showMsg("MARIO JETPACK", "Hold to Fly<br>Release to Fall");

    </script>
</body>
</html>
