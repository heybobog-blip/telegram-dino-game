<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mario Run Remastered</title>
    <style>
        /* จัดหน้าจอให้เต็มมือถือ */
        body { margin: 0; padding: 0; overflow: hidden; background: #000; touch-action: none; }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%); /* ท้องฟ้าไล่สีสวยๆ */
            overflow: hidden;
        }

        /* พื้นดิน */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20%;
            background: #8B4513;
            border-top: 5px solid #5D4037;
        }

        /* หญ้าบนพื้น */
        #grass {
            position: absolute;
            bottom: 20%;
            width: 100%;
            height: 20px;
            background: linear-gradient(#4CAF50, #2E7D32);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* ป้ายคะแนนสวยๆ */
        #scoreBoard {
            position: absolute;
            top: 40px;
            right: 20px;
            font-family: 'Verdana', sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 10;
        }

        /* ข้อความกลางจอ */
        #msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Verdana', sans-serif;
            font-size: 20px;
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 20;
            display: none; /* ซ่อนไว้ก่อน */
        }
        
        /* ปุ่มเริ่มเกม */
        .btn {
            background: #FF5722;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 50px;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px #E64A19;
        }
        .btn:active { box-shadow: 0 2px #E64A19; transform: translateY(2px); }

    </style>
    <script src="https://telegram.org/js/games.js"></script>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreBoard">Score: 0</div>
        <div id="msg">
            <h2 id="msgTitle">Ready?</h2>
            <p id="msgText">Tap screen to jump!</p>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>
        <div id="grass"></div>
        <div id="ground"></div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ปรับขนาด Canvas ให้เต็มจอจริง
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height * 0.8; // พื้นดินอยู่ที่ 80% ของจอ
        }
        window.addEventListener('resize', resize);

        // --- ตั้งค่าเกม (ปรับให้ง่ายขึ้นตรงนี้) ---
        let gameSpeed = 4;     // ความเร็ว (กำลังดี)
        let gravity = 0.5;     // แรงโน้มถ่วง (น้อยลง = ลอยตัวง่าย)
        let jumpPower = -12;   // แรงกระโดด (สูงขึ้น)
        let score = 0;
        let gameRunning = false;
        let groundY;
        
        resize(); // เรียกปรับขนาดครั้งแรก

        // --- กราฟิก SVG (ฝังในโค้ดเลย ไม่ต้องโหลดรูป) ---
        // รูปมาริโอ้ (แบบเวกเตอร์ คมชัดทุกจอ)
        const marioSVG = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMCAzMCI+CiAgPHBhdGggZmlsbD0icmVkIiBkPSJNOCA1aDE0djRoLTR2NGg0djRoLTR2NGg0djRINHdiLTR2LTRoNHYtNGgtNHYtNGg0di00eiIvPgogIDxwYXRoIGZpbGw9IiNmZmNjOTkiIGQ9Ik04IDloMTJ2NGgtNHY0aC00di00aC00eiIvPgogIDxwYXRoIGZpbGw9ImJsdWUiIGQ9Ik04IDE3aDE0djRoLTR2NGg0djVINHdiLTVoNHYtNGgtNHYtNHoiLz4KPC9zdmc+`;
        
        // รูปท่อ
        const pipeSVG = `data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMCA1MCI+CiAgPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjMwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjMmM1ZTFhIiBzdHJva2U9ImJsYWNrIiBzdHJva2Utd2lkdGg9IjIiLz4KICA8cmVjdCB4PSIyIiB5PSIxMCIgd2lkdGg9IjI2IiBoZWlnaHQ9IjQwIiBmaWxsPSIjNDNjZTA1IiBzdHJva2U9ImJsYWNrIiBzdHJva2Utd2lkdGg9IjIiLz4KPC9zdmc+`;

        const marioImg = new Image(); marioImg.src = marioSVG;
        const pipeImg = new Image(); pipeImg.src = pipeSVG;

        // ตัวละคร
        let player = { x: 50, y: 0, w: 40, h: 40, dy: 0, grounded: true };
        let obstacles = [];

        // ข้อมูล URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id'); 
        const chatId = urlParams.get('chat_id');
        const messageId = urlParams.get('message_id');
        
        // **ลิ้งก์ Server ของคุณ**
        const serverUrl = "https://dino-bot-server.onrender.com/submit_score";

        // ปลุก Server รอไว้เลย
        fetch(serverUrl).then(() => console.log("Server Waked up!")).catch(e => console.log("Waking up..."));

        function showMsg(title, text, showButton=true) {
            document.getElementById('msg').style.display = 'block';
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgText').innerHTML = text;
            document.querySelector('.btn').style.display = showButton ? 'inline-block' : 'none';
        }

        function createObstacle() {
            // สุ่มระยะห่างให้มากขึ้น (เล่นง่ายขึ้น)
            let minGap = 400; // ห่างอย่างน้อย 400px (เยอะมาก)
            let maxGap = 700;
            let gap = Math.random() * (maxGap - minGap) + minGap;
            
            // ถ้าเป็นท่อแรก ให้ห่างไกลๆ เลย
            let startX = obstacles.length === 0 ? canvas.width + 100 : obstacles[obstacles.length-1].x + gap;
            
            obstacles.push({ x: startX, y: groundY - 60, w: 50, h: 60 });
        }

        function update() {
            if (!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // --- วาดผู้เล่น ---
            player.dy += gravity;
            player.y += player.dy;
            
            // ชนพื้น
            if (player.y + player.h > groundY) {
                player.y = groundY - player.h;
                player.dy = 0;
                player.grounded = true;
            }
            ctx.drawImage(marioImg, player.x, player.y, player.w, player.h);

            // --- จัดการสิ่งกีดขวาง ---
            if (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 300) {
                createObstacle();
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                
                // วาดท่อ
                ctx.drawImage(pipeImg, obs.x, groundY - obs.h, obs.w, obs.h + 20); // วาดท่อยาวลงไปในดิน

                // เช็คชน (ปรับ Hitbox ให้ชนยากขึ้นอีกนิด ช่วยผู้เล่น)
                if (player.x < obs.x + obs.w - 10 && 
                    player.x + player.w > obs.x + 10 &&
                    player.y + player.h > groundY - obs.h + 5) {
                    gameOver();
                }
            }
            // ลบท่อที่พ้นจอ
            obstacles = obstacles.filter(obs => obs.x > -100);

            // คะแนน
            score++;
            document.getElementById('scoreBoard').innerText = "Score: " + Math.floor(score/10);
            
            // เพิ่มความเร็วทีละนิดเมื่อเล่นไปนานๆ
            if (score % 1000 === 0) gameSpeed += 0.5;

            requestAnimationFrame(update);
        }

        function jump() {
            if (!gameRunning) return;
            if (player.grounded) {
                player.dy = jumpPower;
                player.grounded = false;
            }
        }

        function startGame() {
            document.getElementById('msg').style.display = 'none';
            score = 0;
            gameSpeed = 5; 
            obstacles = [];
            player.y = groundY - 100;
            gameRunning = true;
            createObstacle(); // สร้างท่อแรก
            update();
        }

        function gameOver() {
            gameRunning = false;
            let finalScore = Math.floor(score/10);
            
            showMsg("GAME OVER", `Score: ${finalScore}<br>Saving score...`, false);
            
            // ส่งคะแนน
            fetch(`${serverUrl}?id=${userId}&score=${finalScore}&chat_id=${chatId}&message_id=${messageId}`)
            .then(response => {
                if (response.ok) {
                    showMsg("GAME OVER", `Score: ${finalScore}<br>✅ Saved!`, true);
                    document.querySelector('.btn').innerText = "PLAY AGAIN";
                } else {
                    showMsg("GAME OVER", `Score: ${finalScore}<br>⚠️ Save Error (Server Sleep)`, true);
                }
            })
            .catch(error => {
                showMsg("GAME OVER", `Score: ${finalScore}<br>❌ Connection Fail`, true);
            });
        }

        // การควบคุม
        document.addEventListener('touchstart', (e) => { 
            if(gameRunning) jump(); 
        });
        document.addEventListener('keydown', (e) => { 
            if (e.code === 'Space') {
                if(gameRunning) jump();
                else if(document.getElementById('msg').style.display !== 'none') startGame();
            }
        });
        
        // หน้าจอเริ่มเกม
        showMsg("MARIO RUN", "Tap button to start!");

    </script>
</body>
</html>
